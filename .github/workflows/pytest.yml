name: Unit Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'chainladder/**'
      - 'docs/_ext/**'
      - 'conftest.py'
      - '.coveragerc'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pytest.yml'

  pull_request:
    paths:
      - 'chainladder/**'
      - 'docs/_ext/**'
      - 'conftest.py'
      - '.coveragerc'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pytest.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        # Oldest and newest Python on PRs; the full range on main and nightly.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.11", "3.14"]') || fromJSON('["3.11", "3.12", "3.13", "3.14"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra test --extra docs
      - name: Run tests
        run: uv run pytest -n auto --nbmake --cov=chainladder --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
  linux-pandas2:
    name: (${{ matrix.python-version }}, pandas2, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ 'ubuntu-latest' ]
        python-version: [ '3.11' ]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra test
      - name: Run tests
        run: uv run --with "pandas>=2.3.3,<3" pytest -n auto --nbmake --cov=chainladder --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
