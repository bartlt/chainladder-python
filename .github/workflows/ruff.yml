name: Ruff

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - '**.ipynb'
      - 'pyproject.toml'
      - '.github/workflows/ruff.yml'

  pull_request:
    paths:
      - '**.py'
      - '**.ipynb'
      - 'pyproject.toml'
      - '.github/workflows/ruff.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "latest"

      - name: Run ruff
        run: |
          uvx ruff@0.17.1 check --force-exclude --output-format=github .

      - name: Run ruff format
        run: |
          uvx ruff@0.17.1 format --check --diff --force-exclude .
